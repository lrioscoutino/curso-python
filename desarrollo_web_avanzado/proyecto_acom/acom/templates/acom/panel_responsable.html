<h1>Evaluar inscripción</h1>
<p>{{ inscripcion.estudiante }} — {{ inscripcion.actividad.nombre }} — {{ inscripcion.get_estado_display }}</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form }}
  <button type="submit" name="evaluar">Evaluar</button>
</form>

<form method="post">
  {% csrf_token %}
  <button type="submit" name="emitir_constancia">Emitir constancia</button>
</form>
